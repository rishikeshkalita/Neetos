name: NEETOS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source contract checks
        run: node tests/reliability-contract.test.cjs
      - name: Run API fallback regression tests
        run: node tests/api-handler.test.cjs
